name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project
        run: |
          rm -rf project
          mkdir project
          unzip -o private-vault.zip -d project

      - name: Install Gradle from project settings
        run: |
          SETTINGS=$(find project -type f \( -name "settings.gradle.kts" -o -name "settings.gradle" \) | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle(.kts) not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")
          PROPS="$PROJECT_DIR/gradle/wrapper/gradle-wrapper.properties"

          DIST_URL=$(grep '^distributionUrl=' "$PROPS" | cut -d= -f2- | sed 's/\\:/:/g')

          echo "Gradle distribution: $DIST_URL"

          mkdir -p "$HOME/gradle-dist"

          curl -fsSL "$DIST_URL" -o "$HOME/gradle.zip"

          unzip -q "$HOME/gradle.zip" -d "$HOME/gradle-dist"

          GRADLE_HOME=$(find "$HOME/gradle-dist" -mindepth 1 -maxdepth 1 -type d | head -n 1)

          echo "$GRADLE_HOME/bin" >> "$GITHUB_PATH"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Create debug keystore
        run: |
          keytool -genkeypair \
            -v \
            -keystore "$PROJECT_DIR/debug.keystore" \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Private-Vault-APK
          path: "project/**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Private-Vault-APK
          path: "project/**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
